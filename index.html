<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merge It</title>
<script src="./node_modules/xlsx/dist/xlsx.full.min.js"></script>
<script src="./node_modules/jszip/dist/jszip.min.js"></script>
<style>
  :root{
    --bg:#111827; --panel:#171d2a; --panel2:#1f2937;
    --border:#2c3a50; --text:#edf3ff; --muted:#9aa8bd;
    --accent:#4f8cff; --accent2:#3867d6; --soft:#7dd3fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    font-size:12px; background:linear-gradient(180deg,#0f172a,#111827 30%,#0b1220);
    color:var(--text); padding:14px; overflow:hidden;
  }
  .app{
    max-width:560px; margin:0 auto; background:rgba(23,29,42,0.96);
    border:1px solid var(--border); border-radius:12px;
    padding:12px; display:flex; flex-direction:column; gap:8px;
    box-shadow:0 18px 50px rgba(0,0,0,0.28);
  }
  .brand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
  .title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:0.2px}
  .logo{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--soft));box-shadow:inset 0 1px 0 rgba(255,255,255,0.3)}
  .logo span{font-size:12px;font-weight:800;color:#fff}
  .title small{color:var(--muted);font-weight:500;font-size:11px}
  .pill{padding:4px 8px;border-radius:999px;background:rgba(79,140,255,0.12);border:1px solid rgba(79,140,255,0.35);color:var(--soft);font-size:10px;font-weight:600}

  .field{display:flex;flex-direction:column;gap:3px}
  .field label{color:var(--muted);font-size:11px;font-weight:600}
  input,select{
    width:100%; padding:6px 7px; background:var(--panel2);
    border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-size:12px; font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=file]{padding:4px 6px;font-size:11px}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,140,255,.15)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  .hint{font-size:10px;color:var(--muted);line-height:1.45;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);padding:6px 7px;border-radius:6px}

  .modes{display:flex;gap:14px;font-size:11px;align-items:center;flex-wrap:wrap;padding-top:2px}
  .modes label{display:flex;align-items:center;gap:5px;color:var(--text);cursor:pointer}
  .modes input{width:auto}

  .actions{display:flex;gap:6px;justify-content:flex-end;padding-top:2px}
  button{
    background:linear-gradient(180deg,var(--accent),var(--accent2)); color:#fff; border:0; border-radius:6px;
    padding:7px 13px; font-size:12px; cursor:pointer; font-family:inherit; font-weight:600;
    box-shadow:0 6px 14px rgba(79,140,255,.25);
  }
  button:hover{filter:brightness(1.04)}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);box-shadow:none}
  button.ghost:hover{background:rgba(255,255,255,0.02)}
  button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

  #log{
    font-family:Consolas,monospace; font-size:10.5px; line-height:1.35;
    background:#10141c; border:1px solid var(--border); border-radius:7px;
    padding:6px 8px; height:92px; overflow-y:auto; white-space:pre-wrap;
    color:var(--muted);
  }
  .ok{color:#7ee7a8}.err{color:#fda4af}
</style>
</head>
<body>
<div class="app">

  <div class="brand">
    <div class="title">
      <div class="logo"><span>M</span></div>
      <div>Merge It <small>Excel/CSV → PPTX</small></div>
    </div>
    <div class="pill">Local</div>
  </div>

  <div class="field">
    <label>1. Data file (.xlsx / .xls / .csv)</label>
    <input type="file" id="dataFile" accept=".xlsx,.xls,.csv">
  </div>

  <div class="grid2">
    <div class="field">
      <label>Worksheet</label>
      <select id="sheetSelect" disabled><option>Choose a worksheet</option></select>
    </div>
    <div class="field">
      <label>2. Template (.pptx)</label>
      <input type="file" id="pptxFile" accept=".pptx">
    </div>
  </div>

  <div class="grid3">
    <div class="field"><label>Start row</label><input type="number" id="startRow" value="2" min="1"></div>
    <div class="field"><label>End row</label><input type="number" id="endRow" min="1" placeholder="auto"></div>
    <div class="field"><label>Output name</label><input type="text" id="outName" placeholder="Report"></div>
  </div>

  <div class="hint">Placeholders जस्तै <b>{{Customer Name}}</b> — Excel header सँग हुबहु मिल्नुपर्छ, एकै text run मा।</div>

  <div class="modes">
    <label><input type="radio" name="mode" value="perRow" checked> One PPTX per row</label>
    <label><input type="radio" name="mode" value="single"> One PPTX for all</label>
  </div>

  <div class="actions">
    <button class="ghost" id="clearBtn">Clear</button>
    <button class="ghost" id="previewBtn" disabled>Preview</button>
    <button id="mergeBtn" disabled>Create files</button>
  </div>

  <div id="log">Ready.</div>

</div>

<script>
const state = { workbook:null, headers:[], rows:[] };
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg, cls=''){ logEl.innerHTML = `<span class="${cls}">${msg}</span>`; }

$('dataFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if(!file) return;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    state.workbook = wb;
    const sel = $('sheetSelect');
    sel.innerHTML = wb.SheetNames.map(n=>`<option>${n}</option>`).join('');
    sel.disabled = false;
    loadSheet(wb.SheetNames[0]);
    sel.onchange = () => loadSheet(sel.value);
    log(`Loaded: ${file.name}`, 'ok');
    checkReady();
  }catch(err){ log('Data error: '+err.message, 'err'); }
});

function loadSheet(name){
  const ws = state.workbook.Sheets[name];
  const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  state.headers = (json[0] || []).map(h => String(h).trim());
  state.rows = json.slice(1);
  log(`Sheet "${name}": ${state.headers.length} cols, ${state.rows.length} rows`);
  checkReady();
}

$('pptxFile').addEventListener('change', checkReady);

function checkReady(){
  const ready = state.headers.length && $('pptxFile').files[0];
  $('previewBtn').disabled = !ready;
  $('mergeBtn').disabled = !ready;
}

$('previewBtn').addEventListener('click', () => {
  const start = (+$('startRow').value || 2) - 2;
  const row = state.rows[start];
  if(!row){ log('No row at start position', 'err'); return; }
  let out = 'Preview:\n';
  state.headers.forEach((h,i) => out += `  {{${h}}} → ${row[i]}\n`);
  log(out);
});

function escapeXml(value) {
  return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;').replace(/'/g, '&apos;');
}

function replaceTemplateValues(xml, row) {
  let out = xml;
  state.headers.forEach((header, index) => {
    const token = `{{${header}}}`;
    out = out.split(token).join(escapeXml(row[index]));
  });
  return out;
}

function getSlidePaths(zip) {
  return Object.keys(zip.files)
    .filter(path => /^ppt\/slides\/slide\d+\.xml$/.test(path))
    .sort((a, b) => {
      const aNum = parseInt(a.match(/slide(\d+)\.xml$/)[1], 10);
      const bNum = parseInt(b.match(/slide(\d+)\.xml$/)[1], 10);
      return aNum - bNum;
    });
}

async function buildSinglePresentation(templateZip, rows) {
  const slidePaths = getSlidePaths(templateZip);
  if (!slidePaths.length) throw new Error('Template has no slide content.');

  const outputZip = new JSZip();
  const presentationPath = 'ppt/presentation.xml';
  const presentationRelsPath = 'ppt/_rels/presentation.xml.rels';
  const slideEntries = [];
  const slideRelationshipEntries = [];

  const presentationXml = new TextDecoder().decode(await templateZip.file(presentationPath).async('uint8array'));
  const presentationRelsXml = new TextDecoder().decode(await templateZip.file(presentationRelsPath).async('uint8array'));

  const maxExistingRelId = [...presentationRelsXml.matchAll(/Id="rId(\d+)"/g)].reduce((max, match) => Math.max(max, Number(match[1])), 0);

  let nextSlideNumber = 1;
  for (const row of rows) {
    for (const slidePath of slidePaths) {
      const sourceIndex = slidePath.match(/slide(\d+)\.xml$/)[1];
      const targetSlideName = `slide${nextSlideNumber}.xml`;
      const slideXml = await templateZip.file(slidePath).async('uint8array');
      const renderedXml = replaceTemplateValues(new TextDecoder().decode(slideXml), row);
      outputZip.file(`ppt/slides/${targetSlideName}`, renderedXml);

      const sourceRelPath = slidePath.replace(/^ppt\/slides\//, 'ppt/slides/_rels/').replace(/\.xml$/, '.xml.rels');
      if (templateZip.file(sourceRelPath)) {
        const relXml = await templateZip.file(sourceRelPath).async('uint8array');
        outputZip.file(`ppt/slides/_rels/${targetSlideName.replace(/\.xml$/, '.xml.rels')}`, relXml);
      }

      const relationId = maxExistingRelId + slideEntries.length + 1;
      slideEntries.push(`<p:sldId id="${256 + nextSlideNumber}" r:id="rId${relationId}"/>`);
      slideRelationshipEntries.push(`<Relationship Id="rId${relationId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/${targetSlideName}"/>`);
      nextSlideNumber += 1;
    }
  }

  for (const path in templateZip.files) {
    const file = templateZip.files[path];
    if (file.dir) continue;
    if (path === presentationPath || path === presentationRelsPath) continue;
    if (/^ppt\/slides\/slide\d+\.xml$/.test(path)) continue;
    if (/^ppt\/slides\/_rels\/slide\d+\.xml\.rels$/.test(path)) continue;

    const content = await file.async('uint8array');
    outputZip.file(path, content);
  }

  const updatedPresentationXml = presentationXml.replace(/<p:sldIdLst>.*?<\/p:sldIdLst>/s, `<p:sldIdLst>${slideEntries.join('')}</p:sldIdLst>`);
  outputZip.file(presentationPath, updatedPresentationXml);

  const updatedRelsXml = presentationRelsXml.replace(/<Relationship[^>]*Type="http:\/\/schemas\.openxmlformats\.org\/officeDocument\/2006\/relationships\/slide"[^>]*\/\s*>\s*/g, '').replace(/<\/Relationships>/, `${slideRelationshipEntries.join('')}</Relationships>`);
  outputZip.file(presentationRelsPath, updatedRelsXml);

  return outputZip;
}

async function buildPerRowPresentation(templateZip, row) {
  const outputZip = new JSZip();
  for (const path in templateZip.files) {
    const file = templateZip.files[path];
    if (file.dir) continue;
    const content = await file.async('uint8array');
    if (/^ppt\/slides\/slide\d+\.xml$/.test(path)) {
      let xml = new TextDecoder().decode(content);
      xml = replaceTemplateValues(xml, row);
      outputZip.file(path, xml);
    } else {
      outputZip.file(path, content);
    }
  }
  return outputZip;
}

$('mergeBtn').addEventListener('click', async () => {
  const btn = $('mergeBtn'); btn.disabled = true;
  try{
    const start = (+$('startRow').value || 2) - 2;
    const end = $('endRow').value ? (+$('endRow').value - 1) : state.rows.length;
    const dataRows = state.rows.slice(start, end);
    if(!dataRows.length){ log('No rows in range', 'err'); return; }

    const tplBuf = await $('pptxFile').files[0].arrayBuffer();
    const tplZip = await JSZip.loadAsync(tplBuf);
    const baseName = $('outName').value.trim() || 'output';
    const mode = document.querySelector('input[name=mode]:checked').value;

    if(mode === 'perRow'){
      for(let r=0; r<dataRows.length; r++){
        const row = dataRows[r];
        const outZip = await buildPerRowPresentation(tplZip, row);
        const blob = await outZip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
        const fname = dataRows.length === 1 ? `${baseName}.pptx` : `${baseName}_${r+1}.pptx`;
        download(blob, fname);
        log(`✔ ${fname}`, 'ok');
        await new Promise(res => setTimeout(res, 250));
      }
    } else {
      const outZip = await buildSinglePresentation(tplZip, dataRows);
      const blob = await outZip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
      const fname = `${baseName}.pptx`;
      download(blob, fname);
      log(`✔ ${fname} (all rows merged into one file)`, 'ok');
    }
  }catch(err){
    log('Merge error: '+err.message, 'err'); console.error(err);
  }finally{ btn.disabled = false; }
});

function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

$('clearBtn').addEventListener('click', () => {
  $('dataFile').value=''; $('pptxFile').value='';
  $('sheetSelect').innerHTML='<option>Choose a worksheet</option>';
  $('sheetSelect').disabled=true;
  $('outName').value=''; $('startRow').value=2; $('endRow').value='';
  state.workbook=null; state.headers=[]; state.rows=[];
  log('Ready.'); checkReady();
});
</script>
</body>
</html>
